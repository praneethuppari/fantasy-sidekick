services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
      POSTGRES_DB: fantasy_sidekick
    # Host 5433 avoids clashing with a local Homebrew/Postgres.app on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy -d fantasy_sidekick"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
